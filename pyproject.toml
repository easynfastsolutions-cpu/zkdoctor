[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zkdoctor"
version = "0.1.1"
description = "ZKsync Compatibility Doctor: scan a ZKsync RPC endpoint and compare two scans for compatibility differences."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
zkdoctor = "zkdoctor.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/zkdoctor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a live ZKsync RPC (set ZKDOCTOR_INTEGRATION_RPC)"]
