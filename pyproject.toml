[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zkdoctor"
version = "0.2.0"
description = "ZKsync Compatibility Doctor: scan a ZKsync RPC endpoint, compare two scans, and watch a node against a reference for silent stalls."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
]

[project.urls]
Homepage = "https://github.com/easynfastsolutions-cpu/zkdoctor"
Repository = "https://github.com/easynfastsolutions-cpu/zkdoctor"
Issues = "https://github.com/easynfastsolutions-cpu/zkdoctor/issues"

[project.scripts]
zkdoctor = "zkdoctor.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/zkdoctor"]

[tool.hatch.build.targets.sdist]
# Explicit allowlist: hatchling's default sdist walks the whole working directory and picks up
# anything not gitignored, including files that are merely untracked (never `git add`ed) rather
# than intentionally shipped. This keeps the source tarball to only what's needed to build, test,
# and document the package, regardless of scratch files sitting in the working tree at build time.
include = [
    "/src",
    "/tests",
    "/docs",
    "/experiments",
    "/README.md",
    "/LICENSE",
]
exclude = [
    # one-off ADI incident reproduction artifacts: not committed, not part of the package
    "/docs/validation/2026-09-21-adi",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a live ZKsync RPC (set ZKDOCTOR_INTEGRATION_RPC)"]
