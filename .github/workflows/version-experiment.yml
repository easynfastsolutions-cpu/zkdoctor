# Experiment only: run the UNMODIFIED ZKDoctor V0.1 against two official zksync-os-server
# releases and compare the scans. See experiments/README.md.
#
# Everything runs on GitHub-hosted runners; RPC endpoints are localhost-only inside each job.
name: version-experiment

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/version-experiment.yml"
      - "experiments/**"

permissions:
  contents: read

concurrency:
  group: version-experiment-${{ github.ref }}
  cancel-in-progress: true

env:
  PROTOCOL: v31.0          # local-chains folder; present in both releases below
  FOUNDRY_VERSION: v1.5.1  # version required by the zksync-os-server docs

jobs:
  scan:
    name: scan ${{ matrix.label }} (${{ matrix.version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          # sha256 values are the digests GitHub publishes for these release assets
          - label: A
            version: v0.20.12
            server_sha256: 160874d7cf638af7ac9ead2f4ba030f9dc1249092830f7e14fbd11b740754871
            chains_sha256: b5b95588475cdc5205d27d407b56e164b95534cc1eff24e8fe49c535c63e8222
          - label: B
            version: v0.23.0
            server_sha256: 07bd7e50d12364040df0e3e719bf637c3551f27e594296606179ae3a4df63004
            chains_sha256: a467c502583eccb66a81ae71c7f82e13e0c8e54224bfc5e7af2c29d5a16cbc1a
    env:
      LABEL: ${{ matrix.label }}
      VERSION: ${{ matrix.version }}
      SERVER_SHA256: ${{ matrix.server_sha256 }}
      CHAINS_SHA256: ${{ matrix.chains_sha256 }}
    defaults:
      run:
        shell: bash -e {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Foundry (prebuilt, official action)
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - name: Prepare directories and record runner facts
        run: |
          mkdir -p out logs lab
          {
            echo "label=$LABEL version=$VERSION protocol=$PROTOCOL"
            echo "runner: $(uname -srm) | nproc=$(nproc)"; free -m | sed -n '1,2p'; df -h / | sed -n '1,2p'
            python3 --version; anvil --version | head -n1
          } | tee out/runner-facts.txt

      - name: Download official release assets and verify digests
        run: |
          base="https://github.com/matter-labs/zksync-os-server/releases/download/${VERSION}"
          server="zksync-os-server-${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -fL --retry 5 --retry-all-errors -o server.tgz "${base}/${server}"
          curl -fL --retry 5 --retry-all-errors -o local-chains.tgz "${base}/local-chains.tar.gz"
          echo "${SERVER_SHA256}  server.tgz" | sha256sum -c -
          echo "${CHAINS_SHA256}  local-chains.tgz" | sha256sum -c -
          ls -l server.tgz local-chains.tgz | tee -a out/runner-facts.txt

      - name: Unpack (server binary and local-chains)
        run: |
          tar -tzf server.tgz > logs/server-tar-listing.txt
          tar -tzf local-chains.tgz | head -n 60 > logs/local-chains-listing-head.txt
          mkdir -p lab/bin
          tar -xzf server.tgz -C lab/bin
          tar -xzf local-chains.tgz -C lab
          if [ ! -d "lab/local-chains/${PROTOCOL}" ]; then
            echo "::error::lab/local-chains/${PROTOCOL} not found after extraction"
            cat logs/local-chains-listing-head.txt; exit 1
          fi
          bin="$(find lab/bin -type f \( -name 'zksync-os-server' -o -name 'zksync_os_server' -o -name 'zksync-os' -o -name 'zksync_os_bin' \) | head -n1)"
          if [ -z "$bin" ]; then bin="$(find lab/bin -type f -perm -u+x | head -n1)"; fi
          if [ -z "$bin" ]; then echo "::error::no server binary found"; cat logs/server-tar-listing.txt; exit 1; fi
          chmod +x "$bin"
          echo "SERVER_BIN=$PWD/$bin" >> "$GITHUB_ENV"
          echo "server binary: $bin"; ls -l "$bin"
          gzip -dc "lab/local-chains/${PROTOCOL}/l1-state.json.gz" > lab/l1-state.json
          ls -l "lab/local-chains/${PROTOCOL}"

      - name: Start L1 (Anvil) and wait until ready
        run: |
          nohup anvil --load-state lab/l1-state.json --port 8545 --block-time 0.25 \
            --mixed-mining --slots-in-an-epoch 10 > logs/anvil.log 2>&1 &
          echo "ANVIL_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 60); do
            resp="$(curl -s --max-time 2 -X POST -H 'Content-Type: application/json' \
                 --data '{"jsonrpc":"2.0","id":1,"method":"eth_blockNumber","params":[]}' \
                 http://127.0.0.1:8545 || true)"
            if [[ "$resp" == *'"result"'* ]]; then echo "L1 ready after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "::error::Anvil did not become ready"; tail -n 50 logs/anvil.log; exit 1

      - name: Start ZKsync OS server (L2) and wait until RPC ready
        run: |
          started=$(date +%s.%N)
          cd lab
          RUST_BACKTRACE=1 nohup "$SERVER_BIN" \
            --config local-chains/local_dev.yaml \
            --config "local-chains/${PROTOCOL}/default/config.yaml" \
            > ../logs/server.log 2>&1 &
          pid=$!
          echo "SERVER_PID=$pid" >> "$GITHUB_ENV"
          cd ..
          # sample server memory (RSS) every 2 s for the resource report
          nohup bash -c 'while kill -0 "$0" 2>/dev/null; do ps -o rss= -p "$0" >> logs/server-rss-kb.txt; sleep 2; done' "$pid" > /dev/null 2>&1 &
          ready=0
          for i in $(seq 1 240); do
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "::error::server exited during startup"; tail -n 80 logs/server.log; exit 1
            fi
            resp="$(curl -s --max-time 2 -X POST -H 'Content-Type: application/json' \
                 --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' \
                 http://127.0.0.1:3050 || true)"
            if [[ "$resp" == *'"result"'* ]]; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then echo "::error::L2 RPC not ready after 240s"; tail -n 80 logs/server.log; exit 1; fi
          now=$(date +%s.%N)
          secs=$(python3 -c "print(round($now - $started, 2))")
          echo "{\"label\":\"$LABEL\",\"version\":\"$VERSION\",\"l2_rpc_ready_seconds\":$secs}" | tee out/startup.json

      - name: Install ZKDoctor (unmodified V0.1 from this repository)
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet --disable-pip-version-check .
          .venv/bin/pip freeze > out/pip-freeze.txt
          # not `zkdoctor --version`: that flag is broken in V0.1 (exits 2, "Missing command")
          .venv/bin/python -c "import zkdoctor; print('zkdoctor', zkdoctor.__version__)"

      - name: Scan the L2 endpoint
        run: |
          set +e
          .venv/bin/zkdoctor scan --rpc http://127.0.0.1:3050 --output "out/scan-${LABEL}.json" \
            > "out/scan-${LABEL}.txt" 2>&1
          echo $? > "out/scan-${LABEL}.exit"
          cat "out/scan-${LABEL}.txt"
          echo "zkdoctor scan exit code: $(cat out/scan-${LABEL}.exit)"
          exit 0

      - name: Resource usage summary
        if: always()
        run: |
          {
            echo "--- final ---"
            ps -o pid,rss,etime,args -p "${SERVER_PID:-0}" -p "${ANVIL_PID:-0}" 2>/dev/null || true
            if [ -s logs/server-rss-kb.txt ]; then
              echo "server peak RSS (sampled): $(sort -n logs/server-rss-kb.txt | tail -n1) KB"
            fi
            free -m | sed -n '1,2p'
          } | tee -a out/runner-facts.txt

      - name: Stop processes
        if: always()
        run: |
          kill "${SERVER_PID:-0}" "${ANVIL_PID:-0}" 2>/dev/null || true
          tail -n 2000 logs/server.log > logs/server.tail.log 2>/dev/null || true
          rm -f logs/server.log

      - name: Upload scan and metadata
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scan-${{ matrix.label }}
          path: |
            out/scan-*.json
            out/scan-*.txt
            out/scan-*.exit
            out/startup.json
            out/runner-facts.txt
            out/pip-freeze.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diag-${{ matrix.label }}
          path: logs/
          if-no-files-found: warn
          retention-days: 14

  compare:
    name: compare A vs B
    needs: scan
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash -e {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download scans
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: scan-*
          merge-multiple: true
          path: scans

      - name: Install ZKDoctor (unmodified V0.1 from this repository)
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet --disable-pip-version-check .

      - name: Compare A (v0.20.12) to B (v0.23.0)
        run: |
          mkdir -p out
          ls -l scans
          for f in scans/scan-A.json scans/scan-B.json; do
            [ -f "$f" ] || { echo "::error::missing input $f (a scan job did not produce it)"; exit 1; }
          done
          set +e
          .venv/bin/zkdoctor compare scans/scan-A.json scans/scan-B.json --output out/comparison.json \
            > out/comparison.txt 2>&1
          echo $? > out/comparison.exit
          cat out/comparison.txt
          echo "zkdoctor compare exit code: $(cat out/comparison.exit)"
          exit 0

      - name: Side-by-side summary (raw facts, no classification)
        run: python3 experiments/summarize.py scans/scan-A.json scans/scan-B.json out/comparison.json | tee -a "$GITHUB_STEP_SUMMARY" out/summary.md

      - name: Upload comparison
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: comparison
          path: out/
          retention-days: 30
